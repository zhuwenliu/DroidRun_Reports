.audit .big img{width:100%;height:100%;object-fit:cover}
.audit p.pass{color:#10B981}.audit p.fail{color:#EF4444}
.ring-card{display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.ring::after{content:'';width:60px;height:60px;background:#fff;border-radius:50%;position:absolute}
.ring span{position:relative;z-index:1;font-size:1rem;font-weight:700;color:#10B981}

.timeline .step:not(:last-child)::after{content:'·';position:absolute;right:-1rem;top:30%;transform:translateY(-50%);color:#9ca3af;font-size:.75rem}
.group-title{font-size:.95rem;color:#6b7280;margin:1.2rem 0 .5rem;padding-bottom:.3rem;border-bottom:1px solid #e5e7eb}
.env-section{background:#fff;border-radius:12px;padding:1.2rem;box-shadow:0 2px 8px #0001}
.env-section summary{font-size:1rem;font-weight:600;cursor:pointer;padding:.3rem 0}
.env-section h4{margin:1rem 0 .5rem;font-size:.9rem;color:#374151}
.env-table{width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:.5rem}
.env-table th{background:#f9fafb;text-align:left;padding:.5rem .6rem;border-bottom:2px solid #e5e7eb}
.env-table td{padding:.5rem .6rem;border-bottom:1px solid #f3f4f6}
.env-table tr:nth-child(even) td{background:#f9fafb}
.env-table .deleted{color:#EF4444;font-weight:500}
.prep-timeline{position:relative;padding-left:1.5rem;margin:.5rem 0}
.prep-timeline::before{content:'';position:absolute;left:.45rem;top:.4rem;bottom:.4rem;width:2px;background:#d1d5db}
.prep-timeline .tl-item{position:relative;padding:.4rem 0;font-size:.85rem}
.prep-timeline .tl-item::before{content:'';position:absolute;left:-1.28rem;top:.65rem;width:8px;height:8px;background:#9ca3af;border-radius:50%}
.prep-timeline .tl-item time{color:#6b7280;margin-right:.5rem;font-family:monospace}
.ai-reasoning{background:#f9fafb;border-radius:8px;margin:1rem;padding:1rem;display:flex;gap:.8rem;align-items:flex-start}
.ai-reasoning .ai-icon{font-size:1.5rem;line-height:1}

.baseline-tag{display:inline-block;font-size:.7rem;padding:.1rem .3rem;border-radius:4px;margin-left:.4rem;vertical-align:middle}
.baseline-tag.new{background:#EFF6FF;color:#3B82F6}
.baseline-tag.recovered{background:#ECFDF5;color:#10B981}
.baseline-tag.regressed{background:#FEF2F2;color:#EF4444}
.fail-reason{display:block;font-size:.75rem;color:#EF4444;font-weight:normal;margin-top:.2rem;padding-left:1.5rem}
@media(max-width:600px){.cards{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
